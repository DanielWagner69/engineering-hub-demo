name: Validate (build gate)
# Runs the checks on every push and pull request. Validation only: it never builds or publishes the site.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate and negative tests
        run: |
          if [ -f Makefile ] && [ -d vendor ] && [ -d data/project-d ]; then make check; else echo "No v1.0 data layer on this branch (v0.8 layout); nothing to check."; fi
