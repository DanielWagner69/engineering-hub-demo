<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title id="t">Typed links between Requirement, Product and Verification data</title>
  <desc id="d">A Requirement is satisfied by Product data; Product data is supported by Verification data; Verification demonstrates the Requirement is met. Hub pages link to all three. Each link type sets the direction of change flags; by default a change flags directly linked objects only, and the reviewer decides whether to pass it on. AI may propose links, which a person confirms.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00405E"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D8C89"/></marker>
  </defs>
  <rect width="860" height="400" fill="#F7FBFB"/>
  <!-- nodes -->
  <g font-weight="600" text-anchor="middle">
    <rect x="60" y="60" width="200" height="74" rx="10" fill="#00405E"/><text x="160" y="94" fill="#fff" font-size="17">Requirement</text><text x="160" y="115" fill="#fff" font-size="12" font-weight="400">root of the data</text>
    <rect x="600" y="60" width="200" height="74" rx="10" fill="#46C1BE"/><text x="700" y="94" fill="#00405E" font-size="17">Product</text><text x="700" y="115" fill="#00405E" font-size="12" font-weight="400">parametric models, parts</text>
    <rect x="330" y="256" width="200" height="74" rx="10" fill="#9EDEDC"/><text x="430" y="290" fill="#00405E" font-size="17">Verification</text><text x="430" y="311" fill="#00405E" font-size="12" font-weight="400">analysis, test, calculations</text>
  </g>
  <!-- typed links -->
  <g stroke="#00405E" stroke-width="2.5" fill="none">
    <path d="M266 92H592" marker-end="url(#a)"/>
    <path d="M690 142L530 250" marker-end="url(#a)"/>
    <path d="M330 270L176 142" marker-end="url(#a)"/>
  </g>
  <g font-size="13" fill="#00405E" font-weight="600">
    <text x="429" y="82" text-anchor="middle">satisfied by</text>
    <text x="640" y="214">supported by</text>
    <text x="150" y="214">demonstrates</text>
  </g>
  <!-- hub page -->
  <rect x="345" y="146" width="170" height="48" rx="8" fill="#FFFFFF" stroke="#1D8C89" stroke-width="2"/>
  <text x="430" y="176" font-size="14" font-weight="600" fill="#0B6E73" text-anchor="middle">Hub page</text>
  <g stroke="#1D8C89" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <path d="M345 162L268 128" marker-end="url(#b)"/><path d="M515 162L592 128" marker-end="url(#b)"/><path d="M430 194V250" marker-end="url(#b)"/>
  </g>
  <!-- change flag -->
  <rect x="590" y="262" width="250" height="74" rx="8" fill="#FDEEE7" stroke="#E8835A" stroke-width="1.5"/>
  <text x="715" y="294" font-size="13" font-weight="700" fill="#A8461F" text-anchor="middle">Change flag</text>
  <text x="715" y="312" font-size="12" fill="#A8461F" text-anchor="middle">flags direct links only, in the</text><text x="715" y="327" font-size="12" fill="#A8461F" text-anchor="middle">link type's direction; reviewer passes on</text>
  <text x="30" y="360" font-size="12" fill="#526775">Solid: confirmed typed links. Dashed: links from Hub pages; AI may propose links, a person confirms them before they count as verified.</text>
  <text x="30" y="380" font-size="12" fill="#526775">Generic framework diagram, not a real product.</text>
</svg>
