<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title id="t">Facet levels</title>
  <desc id="d">Product Scope is facet level 0 with four peer options. System and Design Type sit at facet level 1 directly below any Product Scope option. Items below are organised by build levels, which are numbered separately. Lifecycle Stage, Source and Discipline are cross-cutting facets and apply at every build level.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00405E"/></marker>
  </defs>
  <rect width="860" height="420" fill="#F7FBFB"/>
  <!-- level labels -->
  <g font-size="13" font-weight="700" fill="#526775">
    <text x="20" y="38">FACET</text><text x="20" y="54">LEVEL 0</text><text x="20" y="168">FACET</text><text x="20" y="184">LEVEL 1</text><text x="20" y="298">ITEMS</text>
  </g>
  <!-- Level 0 -->
  <text x="110" y="24" font-size="13" fill="#526775">Product Scope (peer options)</text>
  <g font-size="15" font-weight="600">
    <rect x="110" y="34" width="138" height="56" rx="8" fill="#00405E"/><text x="179" y="58" fill="#fff" text-anchor="middle">Aircraft</text><text x="179" y="77" fill="#fff" text-anchor="middle" font-size="12" font-weight="400">top item: Full Aircraft</text>
    <rect x="262" y="34" width="138" height="56" rx="8" fill="#00405E"/><text x="331" y="67" fill="#fff" text-anchor="middle">Ground Equipment</text>
    <rect x="414" y="34" width="138" height="56" rx="8" fill="#00405E"/><text x="483" y="67" fill="#fff" text-anchor="middle">Test Equipment</text>
    <rect x="566" y="34" width="138" height="56" rx="8" fill="#00405E"/><text x="635" y="67" fill="#fff" text-anchor="middle">Facilities</text>
  </g>
  <path d="M407 96V138" stroke="#00405E" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="418" y="122" font-size="12" fill="#526775">directly below any Product Scope option</text>
  <!-- Level 1 -->
  <g font-size="15" font-weight="600" fill="#00405E">
    <rect x="160" y="146" width="230" height="62" rx="8" fill="#46C1BE"/><text x="275" y="172" text-anchor="middle">System</text><text x="275" y="192" text-anchor="middle" font-size="12" font-weight="400">System Group › System (function)</text>
    <rect x="426" y="146" width="230" height="62" rx="8" fill="#46C1BE"/><text x="541" y="172" text-anchor="middle">Design Type</text><text x="541" y="192" text-anchor="middle" font-size="12" font-weight="400">kind of design work</text>
  </g>
  <text x="408" y="232" font-size="12" fill="#526775" text-anchor="middle">alternative views at the same level (the view switcher offers either)</text>
  <path d="M407 240V268" stroke="#00405E" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- Level 2+ -->
  <rect x="160" y="276" width="496" height="58" rx="8" fill="#9EDEDC"/>
  <text x="408" y="300" font-size="15" font-weight="600" fill="#00405E" text-anchor="middle">Items, organised by build levels (separate numbering)</text>
  <text x="408" y="320" font-size="12" fill="#00405E" text-anchor="middle">items take one option per facet; assemblies derive their Systems from their parts</text>
  <!-- cross-cutting -->
  <g>
    <rect x="716" y="20" width="40" height="330" rx="8" fill="#EEF9F8" stroke="#00405E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text transform="translate(741 185) rotate(-90)" font-size="14" font-weight="600" fill="#00405E" text-anchor="middle">Lifecycle Stage</text>
    <rect x="762" y="20" width="40" height="330" rx="8" fill="#EEF9F8" stroke="#00405E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text transform="translate(787 185) rotate(-90)" font-size="14" font-weight="600" fill="#00405E" text-anchor="middle">Source</text>
    <rect x="808" y="20" width="40" height="330" rx="8" fill="#EEF9F8" stroke="#00405E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text transform="translate(833 185) rotate(-90)" font-size="14" font-weight="600" fill="#00405E" text-anchor="middle">Discipline</text>
    <text x="846" y="370" font-size="12" fill="#526775" text-anchor="end">cross-cutting:</text><text x="846" y="386" font-size="12" fill="#526775" text-anchor="end">apply at every build level</text>
  </g>
  <text x="20" y="404" font-size="12" fill="#526775">Every tree in the Hub is a view generated from these tags; nothing is stored in a fixed tree.</text>
</svg>
