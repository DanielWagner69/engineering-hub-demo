<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title id="t">Build levels of the Aircraft scope</title>
  <desc id="d">Build Level 0 is Full Aircraft. Build Level 1 holds the five Major Units (Front Fuselage, Centre Fuselage, Rear Fuselage, Wings, Fins) and Final Assembly, which is not a Major Unit but holds the items assembled with the Major Units to form the Full Aircraft. Below are Build Level 2 Assembly, Build Level 3 Sub-assembly and Build Level 4 Part. Build levels are numbered separately from facet levels.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00405E"/></marker></defs>
  <rect width="900" height="470" fill="#F7FBFB"/>
  <g font-size="12" font-weight="700" fill="#526775"><text x="18" y="52">BUILD</text><text x="18" y="67">LEVEL 0</text><text x="18" y="150">BUILD</text><text x="18" y="165">LEVEL 1</text><text x="18" y="250">BUILD</text><text x="18" y="265">LEVEL 2</text><text x="18" y="320">BUILD</text><text x="18" y="335">LEVEL 3</text><text x="18" y="390">BUILD</text><text x="18" y="405">LEVEL 4</text></g>
  <rect x="330" y="30" width="240" height="56" rx="8" fill="#00405E"/><text x="450" y="56" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Full Aircraft</text><text x="450" y="75" fill="#fff" font-size="12" text-anchor="middle">top item of the Aircraft scope</text>
  <path d="M450 86L159 128" stroke="#00405E" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="100" y="132" width="118" height="50" rx="8" fill="#46C1BE"/><text x="159" y="161" fill="#00405E" font-size="13" font-weight="700" text-anchor="middle">Front Fuselage</text>
  <path d="M450 86L287 128" stroke="#00405E" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="228" y="132" width="118" height="50" rx="8" fill="#46C1BE"/><text x="287" y="161" fill="#00405E" font-size="13" font-weight="700" text-anchor="middle">Centre Fuselage</text>
  <path d="M450 86L415 128" stroke="#00405E" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="356" y="132" width="118" height="50" rx="8" fill="#46C1BE"/><text x="415" y="161" fill="#00405E" font-size="13" font-weight="700" text-anchor="middle">Rear Fuselage</text>
  <path d="M450 86L543 128" stroke="#00405E" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="484" y="132" width="118" height="50" rx="8" fill="#46C1BE"/><text x="543" y="161" fill="#00405E" font-size="13" font-weight="700" text-anchor="middle">Wings</text>
  <path d="M450 86L671 128" stroke="#00405E" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="612" y="132" width="118" height="50" rx="8" fill="#46C1BE"/><text x="671" y="161" fill="#00405E" font-size="13" font-weight="700" text-anchor="middle">Fins</text>
  <path d="M450 86L799 128" stroke="#00405E" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <rect x="740" y="132" width="118" height="50" rx="8" fill="#FFFFFF" stroke="#00405E" stroke-width="2" stroke-dasharray="6 4"/><text x="799" y="153" fill="#00405E" font-size="13" font-weight="700" text-anchor="middle">Final Assembly</text><text x="799" y="171" fill="#526775" font-size="11" text-anchor="middle">not a Major Unit</text>
  <text x="415" y="200" font-size="12" fill="#526775" text-anchor="middle">Major Units (Aircraft scope only)</text>
  <text x="799" y="200" font-size="11" fill="#526775" text-anchor="middle">items assembled with the</text><text x="779" y="213" font-size="11" fill="#526775" text-anchor="middle">Major Units, e.g. joining pipes, looms</text>
  <rect x="230" y="234" width="440" height="44" rx="8" fill="#9EDEDC"/><text x="450" y="261" fill="#00405E" font-size="14" font-weight="600" text-anchor="middle">Assembly</text>
  <rect x="230" y="304" width="440" height="44" rx="8" fill="#9EDEDC"/><text x="450" y="331" fill="#00405E" font-size="14" font-weight="600" text-anchor="middle">Sub-assembly</text>
  <rect x="230" y="374" width="440" height="44" rx="8" fill="#9EDEDC"/><text x="450" y="401" fill="#00405E" font-size="14" font-weight="600" text-anchor="middle">Part (Part Instance)</text>
  <path d="M450 222V232" stroke="#00405E" stroke-width="2" marker-end="url(#ah)"/><path d="M450 278V302" stroke="#00405E" stroke-width="2" marker-end="url(#ah)"/><path d="M450 348V372" stroke="#00405E" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="690" y="234" width="194" height="184" rx="8" fill="#FEF3DC" stroke="#F2A541" stroke-width="1.5"/>
  <text x="702" y="256" font-size="12" fill="#7A5000" font-weight="700">Not facet levels.</text>
  <text x="702" y="274" font-size="12" fill="#7A5000">Facet levels are numbered</text>
  <text x="702" y="292" font-size="12" fill="#7A5000">separately: Product Scope is</text>
  <text x="702" y="310" font-size="12" fill="#7A5000">facet level 0; System and</text>
  <text x="702" y="328" font-size="12" fill="#7A5000">Design Type are facet level 1.</text>
  <text x="702" y="346" font-size="12" fill="#7A5000"></text>
  <text x="702" y="364" font-size="12" fill="#7A5000">Each item has one parent</text>
  <text x="702" y="382" font-size="12" fill="#7A5000">at the build level above</text>
  <text x="702" y="400" font-size="12" fill="#7A5000">(product-build view only).</text>
  <text x="18" y="446" font-size="12" fill="#526775">Other Product Scopes (Ground Equipment, Test Equipment, Facilities) have their top items at Build Level 0; their lower build levels will be defined later.</text>
  <text x="18" y="462" font-size="12" fill="#526775">Generic framework diagram, not a real product.</text>
</svg>
