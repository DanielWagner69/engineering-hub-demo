<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui,sans-serif">
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#46C1BE" stroke-opacity=".12"/></pattern>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E4F6E"/><stop offset="1" stop-color="#00405E"/></linearGradient>
<linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8F0EE"/><stop offset=".5" stop-color="#46C1BE"/><stop offset="1" stop-color="#1E7F7C"/></linearGradient></defs>
<rect width="1200" height="600" fill="url(#sk)"/><rect width="1200" height="600" fill="url(#g)"/>
