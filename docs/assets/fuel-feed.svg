<g id="hs-strainer"><rect x="340" y="384" width="36" height="32" rx="6" fill="#EAF7F6" stroke="#00405E" stroke-width="2"/></g>
<g id="hs-valve"><rect x="400" y="350" width="60" height="44" rx="8" fill="#F6B26B" stroke="#00405E" stroke-width="2"/><circle cx="430" cy="372" r="10" fill="#00405E"/><rect x="398" y="394" width="64" height="30" fill="#9EDEDC" stroke="#00405E" stroke-width="2"/></g>
