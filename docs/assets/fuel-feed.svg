<!-- callouts -->
<g font-size="15" fill="#fff" stroke="#46C1BE" stroke-width="1.5">
<line x1="358" y1="384" x2="300" y2="250"/><line x1="430" y1="350" x2="430" y2="180"/><line x1="580" y1="220" x2="640" y2="150"/><line x1="740" y1="226" x2="790" y2="170"/><line x1="1030" y1="300" x2="1040" y2="220"/></g>
<g font-size="15" fill="#fff"><text x="230" y="244">Strainer</text><text x="380" y="172">Shut-off valve</text><text x="620" y="144">Twin-pipe bracket FR15</text><text x="780" y="164">P-clamps</text><text x="960" y="212">Cross-join spool</text></g>
<text x="1040" y="360" fill="#C8F0EE" font-size="14">→ engine feed</text>
